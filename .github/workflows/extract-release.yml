name: 解压 Release ZIP 并重新发布
run-name: 解压 Release ${{ github.event.release.tag_name || '手动触发' }} 的附件

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 要处理的 Release 版本标签
        required: true
        default: v1.0.0

jobs:
  extract-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 确定目标 Release 标签
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 下载 Release 中的 ZIP 附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          mkdir -p download
          cd download
          
          # 显式指定仓库，无需本地 Git 环境
          gh release download "$TAG" --repo "$REPO" --pattern "*.zip"
          
          # 删除 GitHub 自动生成的源码包
          rm -f "Source code.zip"
          
          # 取剩余第一个 ZIP 作为目标文件
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "错误：未找到目标 ZIP 文件"
            ls -la
            exit 1
          fi
          
          echo "找到目标文件：$ZIP_FILE"
          echo "ZIP_PATH=download/$ZIP_FILE" >> "$GITHUB_ENV"

      - name: 解压 ZIP 文件
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted
          echo "解压完成，文件列表："
          ls -la extracted

      - name: 打包并上传回原 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          cd extracted
          zip -r -q ../extracted-release.zip .
          cd ..
          
          gh release upload "$TAG" extracted-release.zip --repo "$REPO" --clobber
          echo "已将解压后的包上传到 Release $TAG"
